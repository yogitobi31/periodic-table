<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프리미엄 인터랙티브 주기율표</title>
  <style>
    :root{--bg:#0b1020;--card:#121a33;--muted:#9fb0d6;--txt:#eef3ff;--accent:#6ea8ff;--ok:#4fd1c5}
    [data-theme="light"]{--bg:#f3f7ff;--card:#fff;--muted:#5b6786;--txt:#121a33;--accent:#3056d3;--ok:#0f766e}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#1b2750,var(--bg));color:var(--txt)}
    .wrap{max-width:1400px;margin:auto;padding:16px} .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    input,button,select{border:none;border-radius:12px;padding:10px 12px;background:var(--card);color:var(--txt)}
    button{cursor:pointer} .chip{font-size:12px}.on{outline:2px solid var(--accent)}
    .table{display:grid;grid-template-columns:repeat(18,minmax(34px,1fr));gap:6px;margin-top:12px}
    .el{background:var(--card);border:1px solid #2a3a66;border-radius:10px;min-height:56px;padding:4px;display:flex;flex-direction:column;justify-content:space-between}
    .el.hide{opacity:.15}.el .n{font-size:10px;color:var(--muted)} .el .s{font-weight:700;text-align:center}
    .panel{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:14px}
    .card{background:var(--card);border-radius:14px;padding:12px;border:1px solid #2a3a66}
    canvas{width:100%;max-width:360px;height:240px;background:#0001;border-radius:10px}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:980px){.panel{grid-template-columns:1fr}.table{grid-template-columns:repeat(9,minmax(34px,1fr));}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>프리미엄 인터랙티브 주기율표</h1>
  <div class="top">
    <input id="q" placeholder="검색: 한글명/기호/원자번호" />
    <button id="theme">다크/라이트</button>
    <button class="chip on" data-f="all">전체</button><button class="chip" data-f="metal">금속</button><button class="chip" data-f="nonmetal">비금속</button>
    <button class="chip" data-f="gas">기체</button><button class="chip" data-f="liquid">액체</button><button class="chip" data-f="radioactive">방사성</button><button class="chip" data-f="synthetic">합성</button>
    <button id="quizBtn">퀴즈 시작</button><span id="best"></span>
  </div>
  <div id="cats" class="top" style="margin-top:8px"></div>
  <div id="table" class="table"></div>
  <div class="panel">
    <div class="card"><h3>원소 상세</h3><div id="detail">원소를 선택하세요.</div><canvas id="atom" width="360" height="240"></canvas></div>
    <div class="card"><h3>비교 모드 (2개 선택)</h3><div class="compare"><div id="c1">-</div><div id="c2">-</div></div><hr/><div id="quiz"></div></div>
  </div>
</div>
<script>
const symbols=`H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og`.split(' ');
const names=symbols.map((s,i)=>({n:i+1,sym:s,name:s,category:i%9,group:(i%18)+1,period:Math.floor(i/18)+1,phase:["solid","gas","solid","solid","solid","solid","gas","gas","gas","gas"][i%10]}));
const catNames=["alkali metal","alkaline earth metal","transition metal","post-transition metal","metalloid","nonmetal","noble gas","lanthanide","actinide"];
const radioactive=new Set([43,61,84,85,86,87,88,...Array.from({length:26},(_,k)=>k+93)]);
const synthetic=new Set([43,61,...Array.from({length:25},(_,k)=>k+94)]);
let selected=[],filter='all',query='';
const table=document.getElementById('table'),detail=document.getElementById('detail');
function isMetal(e){return [0,1,2,3,7,8].includes(e.category)}
function match(e){const t=query.toLowerCase();const ok= !t||e.name.toLowerCase().includes(t)||e.sym.toLowerCase().includes(t)||String(e.n)===t; if(!ok)return false;
if(filter==='all')return true; if(filter==='metal')return isMetal(e); if(filter==='nonmetal')return !isMetal(e); if(filter==='gas'||filter==='liquid')return e.phase===filter; if(filter==='radioactive')return radioactive.has(e.n); if(filter==='synthetic')return synthetic.has(e.n); return catNames[e.category]===filter;}
function render(){table.innerHTML=''; names.forEach(e=>{const d=document.createElement('button');d.className='el'+(match(e)?'':' hide');d.innerHTML=`<span class=n>${e.n}</span><span class=s>${e.sym}</span><span style='font-size:10px'>${e.name}</span>`; d.onclick=()=>pick(e); table.appendChild(d);});}
function pick(e){if(!selected.find(x=>x.n===e.n)){selected=[...selected,e].slice(-2)}; detail.innerHTML=`<b>${e.name} (${e.sym})</b><br>원자번호: ${e.n}<br>분류: ${catNames[e.category]}<br>상태: ${e.phase}<br>${radioactive.has(e.n)?'방사성':''} ${synthetic.has(e.n)?'합성':''}`; document.getElementById('c1').textContent=selected[0]?`${selected[0].sym} (${selected[0].n})`:'-'; document.getElementById('c2').textContent=selected[1]?`${selected[1].sym} (${selected[1].n})`:'-'; draw(e.n);}
function draw(z){const c=document.getElementById('atom'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.fillStyle='#fbbf24';x.beginPath();x.arc(0,0,8,0,7);x.fill();const shells=[2,8,18,32,32,18,8];let left=z,r=26,spin=performance.now()/450;for(let i=0;i<shells.length&&left>0;i++){const cnt=Math.min(shells[i],left);x.strokeStyle='rgba(120,150,255,.4)';x.beginPath();x.arc(0,0,r,0,7);x.stroke();for(let j=0;j<cnt;j++){const a=(j/cnt)*Math.PI*2+spin*(0.3+i*0.1);x.fillStyle='#60a5fa';x.beginPath();x.arc(Math.cos(a)*r,Math.sin(a)*r,3,0,7);x.fill()}left-=cnt;r+=22}x.setTransform(1,0,0,1,0,0)}
function startQuiz(){let score=0;const bestKey='pt_best';const qBox=document.getElementById('quiz');ask();function ask(){const a=names[Math.floor(Math.random()*names.length)];qBox.innerHTML=`기호 <b>${a.sym}</b> 의 원자번호는? <input id='ans' style='width:90px'><button id='ok'>확인</button> 점수:${score}`;document.getElementById('ok').onclick=()=>{if(+document.getElementById('ans').value===a.n){score++;ask()}else{const best=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,best);document.getElementById('best').textContent='최고 점수: '+best;qBox.innerHTML=`종료! 정답:${a.n}, 점수:${score}`;}}}}
const catWrap=document.getElementById('cats');catNames.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>{filter=c;render()};catWrap.appendChild(b)});
document.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render();});
document.getElementById('q').oninput=e=>{query=e.target.value.trim();render()};
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'};
document.getElementById('quizBtn').onclick=startQuiz;document.getElementById('best').textContent='최고 점수: '+(localStorage.getItem('pt_best')||0);
render();requestAnimationFrame(function loop(){if(selected[0])draw(selected.at(-1).n);requestAnimationFrame(loop)});
</script>
</body>
</html>
