<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인터랙티브 주기율표</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#eeece8;
  --page-backdrop-top:#f6f2eb;--page-backdrop-bottom:#efeae2;
  --text:#1a1a18;--text2:#6b6b66;--text3:#9b9b96;
  --panel-bg:rgba(255,255,255,0.72);--panel-text:#1a1a18;--panel-muted:#6b6b66;--panel-soft:rgba(255,255,255,0.55);
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.25);
  --radius:8px;--radius-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#272724;--bg3:#202020;
    --page-backdrop-top:#f3f0ea;--page-backdrop-bottom:#eeece8;
    --text:#f0ede8;--text2:#a0a09a;--text3:#6a6a65;
    --panel-bg:rgba(255,255,255,0.72);--panel-text:#1a1a18;--panel-muted:#6b6b66;--panel-soft:rgba(255,255,255,0.55);
    --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.22);
  }
}
body{font-family:var(--font);background:
  radial-gradient(circle at top, rgba(255,255,255,0.72), transparent 420px),
  linear-gradient(180deg,var(--page-backdrop-top) 0%,var(--page-backdrop-bottom) 100%);
  color:var(--text);min-height:100vh;padding:34px 12px 60px}
header{max-width:1280px;margin:0 auto 18px}
h1{font-size:20px;font-weight:500;margin-bottom:3px;color:#1a1a18}
.sub{font-size:13px;color:#6b6b66}
#app{max-width:1280px;margin:0 auto}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;align-items:center}
#search{flex:1;min-width:130px;max-width:190px;height:30px;font-size:12px;padding:0 10px;
  border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
#search:focus{border-color:#378ADD}
.fb{height:27px;padding:0 9px;font-size:11px;border:0.5px solid var(--border2);border-radius:var(--radius);
  background:var(--bg);color:var(--text2);cursor:pointer;transition:background 0.1s,color 0.1s}
.fb:hover,.fb.active{background:var(--bg2);color:var(--text)}
#compare-toggle{height:27px;padding:0 10px;font-size:11px}
#layer-controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px 0;align-items:center}
.lb{height:24px;padding:0 8px;font-size:10px;border:0.5px solid var(--border2);border-radius:999px;
  background:transparent;color:var(--text2);cursor:pointer;transition:background 0.1s,color 0.1s}
.lb:hover,.lb.active{background:var(--bg2);color:var(--text)}
#layer-note{font-size:11px;color:var(--text2);min-height:16px;margin-bottom:8px}
#mode-note{font-size:10px;color:var(--text2);min-height:14px;margin:0 0 8px 2px;line-height:1.4}
#master-study-controls{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px 2px}
#master-study-controls.show{display:flex}
.cell.hide-name .elname{visibility:hidden}
.cell.hide-sym .sym{visibility:hidden}
#legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.leg{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text2)}
.leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
#grid{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin-bottom:3px}
.cell{aspect-ratio:1;border-radius:3px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:1px;border:0.5px solid transparent;
  transition:transform 0.1s,border-color 0.1s;min-width:0;-webkit-tap-highlight-color:transparent}
.cell:hover{transform:scale(1.14);z-index:10;border-color:rgba(0,0,0,0.35)}
.cell.sel{transform:scale(1.08);z-index:5;border-width:1.5px}
.cell.rel-focus{box-shadow:0 0 0 2px rgba(0,0,0,0.12),0 4px 10px rgba(0,0,0,0.08)}
.cell.rel-group{outline:1px solid rgba(0,0,0,0.28);outline-offset:-1px;box-shadow:0 0 0 1px rgba(255,255,255,0.36) inset}
.cell.rel-period{outline:1px dashed rgba(0,0,0,0.2);outline-offset:-2px;opacity:0.94}
.cell.rel-group.rel-period{outline:1px solid rgba(0,0,0,0.26)}
.cell.dimmed{opacity:0.13}
.cell .num{font-size:6px;opacity:0.6;line-height:1;pointer-events:none}
.cell .sym{font-size:10px;font-weight:500;line-height:1.15;pointer-events:none}
.cell .elname{font-size:5px;opacity:0.7;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%;pointer-events:none}
.blank{background:transparent!important;pointer-events:none;border:none!important}
.srow{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin-bottom:2px}
.slbl{font-size:8px;color:var(--text3);grid-column:1/4;display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
#panel{margin-top:12px;background:var(--panel-bg);border:0.5px solid rgba(0,0,0,0.12);border-radius:var(--radius-lg);padding:18px;display:none;color:var(--panel-text)}
#panel.show{display:block}
#panel-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
#pbadge{width:62px;height:62px;border-radius:var(--radius);display:flex;flex-direction:column;
  align-items:center;justify-content:center;flex-shrink:0}
#pbadge .psym{font-size:26px;font-weight:500;line-height:1}
#pbadge .pnum{font-size:10px;opacity:0.7}
#pinfo{flex:1;min-width:0}
#pname{font-size:17px;font-weight:500;color:var(--panel-text)}
#pcat{font-size:12px;color:var(--panel-muted);margin-top:2px}
#pec{font-size:11px;color:var(--panel-muted);margin-top:4px}
#pclose{height:27px;padding:0 12px;font-size:11px;cursor:pointer;border:0.5px solid var(--border2);
  border-radius:var(--radius);background:transparent;color:var(--text2);align-self:flex-start;flex-shrink:0}
#pclose:hover{background:rgba(255,255,255,0.68)}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
.st{background:var(--panel-soft);border:0.5px solid rgba(0,0,0,0.08);border-radius:var(--radius);padding:8px 10px}
.st-l{font-size:10px;color:var(--panel-muted);margin-bottom:3px}
.st-v{font-size:13px;font-weight:500;color:var(--panel-text)}
	#canvas-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
	#ecanvas{display:block;width:min(100%,420px);height:auto;aspect-ratio:4/3}
	#shell-note{font-size:11px;color:var(--panel-muted);text-align:center}
#story-card{margin-top:10px;background:var(--panel-soft);border:0.5px solid rgba(0,0,0,0.08);border-radius:var(--radius);padding:10px 12px}
.story-title{font-size:11px;color:var(--panel-muted);margin-bottom:5px}
#story-text{font-size:12px;color:var(--panel-text);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
#compare-card{display:none;margin-top:14px;background:var(--panel-soft);border:0.5px solid rgba(0,0,0,0.08);border-radius:var(--radius);padding:10px 12px}
#compare-card.show{display:block}
.cmp-title{font-size:11px;color:var(--panel-muted);margin-bottom:7px}
.cmp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:11px;color:var(--panel-text)}
.cmp-col{background:var(--panel-bg);border:0.5px solid rgba(0,0,0,0.08);border-radius:var(--radius);padding:8px}
.cmp-head{font-size:12px;font-weight:500;margin-bottom:5px;color:var(--panel-text)}
.cmp-line{font-size:11px;color:var(--panel-muted);margin:2px 0}
.cmp-note{font-size:11px;color:var(--panel-muted);margin-top:8px;line-height:1.45}
@media(prefers-color-scheme:dark){
  h1{color:#1a1a18}
  .sub{color:#6b6b66}
  #panel,#compare-card,.st,.cmp-col{background:var(--panel-bg);color:var(--panel-text)}
  .st{background:var(--panel-soft)}
  #search,.fb,.lb,#pclose{background:rgba(255,255,255,0.78);color:#2a2a26;border-color:rgba(0,0,0,0.22)}
  .fb:hover,.fb.active,.lb:hover,.lb.active,#pclose:hover{background:rgba(255,255,255,0.92);color:#1a1a18}
}
footer{max-width:1280px;margin:28px auto 0;text-align:center;padding:12px 8px;background:transparent}
.credit-title{font-family:Georgia,"Times New Roman",serif;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text2)}
.credit-sub{font-family:Georgia,"Times New Roman",serif;font-size:11px;font-style:italic;color:var(--text2);margin-top:4px}
.credit-copy{font-size:10px;color:var(--text3);margin-top:4px}
.credit-ko{font-size:9px;color:var(--text3);margin-top:3px}

@media (min-width:768px) and (max-width:1023px){
  .cell{padding:2px;border-radius:4px}
  .cell .num{font-size:7px}
  .cell .sym{font-size:13px;font-weight:600}
  .cell .elname{font-size:6px}
}
@media (min-width:1024px){
  .cell{padding:4px 3px;border-radius:5px}
  .cell .num{font-size:8px}
  .cell .sym{font-size:15px;font-weight:600}
  .cell .elname{font-size:7px}
}
@media(max-width:680px){.cmp-grid{grid-template-columns:1fr} body{padding:22px 10px 54px}}
</style>
</head>
<body>
<header>
  <h1>인터랙티브 주기율표</h1>
  <p class="sub">118개 원소 · 원소를 클릭하면 전자 배치 애니메이션을 볼 수 있습니다</p>
</header>
<div id="app">
  <div id="controls">
    <input id="search" type="text" placeholder="원소 검색 (이름, 기호, 번호)..." />
    <button class="fb active" data-cat="all">전체</button>
    <button class="fb" data-cat="nonmetal">비금속</button>
    <button class="fb" data-cat="noble gas">비활성 기체</button>
    <button class="fb" data-cat="alkali metal">알칼리 금속</button>
    <button class="fb" data-cat="alkaline earth metal">알칼리 토금속</button>
    <button class="fb" data-cat="metalloid">반금속</button>
    <button class="fb" data-cat="transition metal">전이 금속</button>
    <button class="fb" data-cat="post-transition metal">전이 후 금속</button>
    <button class="fb" data-cat="lanthanide">란타넘족</button>
    <button class="fb" data-cat="actinide">악티늄족</button>
    <button class="fb" id="relation-toggle">같은 족·주기 보기</button>
    <button class="fb" id="compare-toggle">두 원소 비교</button>
    <button class="fb" id="master-toggle">1~20 원소 마스터</button>
  </div>
  <div id="mode-note"></div>
  <div id="master-study-controls">
    <button class="lb active" data-master-view="all">전체 보기</button>
    <button class="lb" data-master-view="hide-name">이름 가리기</button>
    <button class="lb" data-master-view="hide-sym">기호 가리기</button>
  </div>
  <div id="layer-controls">
    <button class="lb active" data-layer="none">기본</button>
    <button class="lb" data-layer="radius">원자 반지름</button>
    <button class="lb" data-layer="en">전기음성도</button>
    <button class="lb" data-layer="ionization">이온화 에너지</button>
    <button class="lb" data-layer="metallicity">금속성</button>
    <button class="lb" data-layer="valence">최외각 전자</button>
  </div>
  <div id="layer-note">기본: 기존 원소 분류 색상을 표시합니다.</div>
  <div id="legend"></div>
  <div id="grid"></div>
  <div id="series-area"></div>
  <div id="panel">
    <div id="panel-top">
      <div id="pbadge"><span class="psym" id="psym"></span><span class="pnum" id="pnum"></span></div>
      <div id="pinfo">
        <div id="pname"></div>
        <div id="pcat"></div>
        <div id="pec"></div>
      </div>
      <button id="pclose" onclick="closePanel()">닫기</button>
    </div>
    <div id="stats">
      <div class="st"><div class="st-l">원자 질량</div><div class="st-v" id="s-mass"></div></div>
      <div class="st"><div class="st-l">상태 (실온)</div><div class="st-v" id="s-phase"></div></div>
      <div class="st"><div class="st-l">전기음성도</div><div class="st-v" id="s-en"></div></div>
      <div class="st"><div class="st-l">주기</div><div class="st-v" id="s-period"></div></div>
      <div class="st"><div class="st-l">족</div><div class="st-v" id="s-group"></div></div>
      <div class="st"><div class="st-l">전자 수</div><div class="st-v" id="s-ecount"></div></div>
    </div>
	    <div id="canvas-wrap">
	      <canvas id="ecanvas" width="320" height="240"></canvas>
	      <div id="shell-note">전자껍질: - / 최외각 전자: -개</div>
	    </div>
      <div id="story-card">
        <div class="story-title">원소 이야기</div>
        <div id="story-text">이 원소의 이야기는 준비 중입니다.</div>
      </div>
      <div id="compare-card"></div>
      <div id="relation-note" style="margin-top:10px;font-size:11px;color:var(--panel-muted);line-height:1.5"></div>
	  </div>
</div>
<footer>
  <div class="credit-title">ELEMENT RELATION ATLAS</div>
  <div class="credit-sub">An interactive chemistry archive by Juwon Jeon</div>
  <div class="credit-copy">© 2026 Juwon Jeon. All rights reserved.</div>
  <div class="credit-ko">Presented by Pilup Academy</div>
</footer>

<script>
const CC={
  "alkali metal":   {bg:"#FAECE7",text:"#4A1B0C",bd:"#D85A30"},
  "alkaline earth metal":{bg:"#FAEEDA",text:"#412402",bd:"#BA7517"},
  "transition metal":{bg:"#E6F1FB",text:"#042C53",bd:"#378ADD"},
  "post-transition metal":{bg:"#EAF3DE",text:"#173404",bd:"#639922"},
  "metalloid":      {bg:"#EEEDFE",text:"#26215C",bd:"#7F77DD"},
  "nonmetal":       {bg:"#E1F5EE",text:"#04342C",bd:"#1D9E75"},
  "noble gas":      {bg:"#FBEAF0",text:"#4B1528",bd:"#D4537E"},
  "lanthanide":     {bg:"#F1EFE8",text:"#2C2C2A",bd:"#888780"},
  "actinide":       {bg:"#FCEBEB",text:"#501313",bd:"#E24B4A"},
  "unknown":        {bg:"#F1EFE8",text:"#2C2C2A",bd:"#B4B2A9"}
};
const CKR={"alkali metal":"알칼리 금속","alkaline earth metal":"알칼리 토금속","transition metal":"전이 금속","post-transition metal":"전이 후 금속","metalloid":"반금속","nonmetal":"비금속","noble gas":"비활성 기체","lanthanide":"란타넘족","actinide":"악티늄족","unknown":"미분류"};
const PKR={"solid":"고체","liquid":"액체","gas":"기체","unknown":"불명"};

const ELEMENT_STORIES={
  1:"우주에서 가장 많은 원소로, 별이 빛날 때 핵심 연료가 됩니다. 아주 가볍고 반응이 쉬워 다른 원소와 빠르게 결합합니다.",
  2:"헬륨은 거의 반응하지 않는 차분한 기체라 다루기 비교적 안전합니다. 풍선을 띄우고 MRI 같은 장비를 차갑게 유지할 때 쓰입니다.",
  3:"리튬은 가장 가벼운 금속이라 에너지를 가볍게 저장하는 데 유리합니다. 그래서 휴대폰·전기차 배터리의 대표 재료가 되었습니다.",
  4:"베릴륨은 가볍지만 단단해서 무게를 줄여야 하는 부품에 쓰입니다. 항공·우주 장비나 정밀 기기에 들어가며, 분진은 유해해 취급에 주의가 필요합니다.",
  5:"붕소는 금속과 비금속의 중간 성격을 보여 주는 반금속입니다. 유리·세제·내열 소재에 쓰이는 붕사와 연결되어 생활 속에서도 만날 수 있습니다.",
  6:"탄소는 생명 분자의 골격을 만드는 핵심 원소입니다. 같은 탄소라도 다이아몬드처럼 매우 단단하거나 흑연처럼 부드러운 모습으로 존재할 수 있습니다.",
  7:"질소는 공기의 대부분을 차지해 우리 주변에 항상 있습니다. 단백질과 DNA를 이루는 성분이라 생명 활동에도 꼭 필요합니다.",
  8:"산소는 우리가 숨 쉬는 데 필수이고, 불이 타는 과정에도 깊게 관여합니다. 물(H₂O)과 다양한 산화물의 재료라 화학에서 자주 등장합니다.",
  9:"플루오린은 반응성이 매우 큰 할로젠이라 단독으로는 다루기 어렵습니다. 대신 화합물 형태로 치아 보호 재료나 특수 코팅에 활용됩니다.",
  10:"네온은 반응이 거의 없는 비활성 기체라 안정적입니다. 방전관에 넣으면 선명한 빛을 내서 간판 조명으로 유명합니다.",
  11:"나트륨은 물과도 빠르게 반응하는 활발한 알칼리 금속입니다. 염소와 결합하면 우리가 먹는 소금(염화나트륨)의 일부가 됩니다.",
  12:"마그네슘은 가볍고 밝게 타는 성질이 있어 불꽃 반응 실험에서 눈에 띕니다. 합금 재료로도 쓰이고 우리 몸에서는 근육·신경 기능에 필요한 이온입니다.",
  13:"알루미늄은 가볍고 잘 녹슬지 않아 일상에서 가장 친숙한 금속 중 하나입니다. 음료 캔, 포일, 비행기 재료처럼 넓은 분야에 쓰입니다.",
  14:"규소는 반도체 칩의 핵심 재료라 전자기기의 중심에 있습니다. 모래와 유리의 주성분이기도 해서 자연에서도 흔히 볼 수 있습니다.",
  15:"인은 DNA와 세포막, ATP 같은 에너지 전달 분자에 들어가는 중요한 원소입니다. 생명체가 자라고 에너지를 쓰는 과정에 깊게 관여합니다.",
  16:"황은 노란 고체로 알려져 있고 화산 지대의 냄새와도 자주 연결됩니다. 단백질의 구조를 안정화하는 데도 쓰여 생명체 안에서 역할이 있습니다.",
  17:"염소는 반응성이 큰 할로젠으로 다른 원소와 쉽게 결합합니다. 나트륨과 만나면 소금이 되고, 물 소독용 화합물로도 널리 쓰입니다.",
  18:"아르곤은 공기 중에 조금 들어 있는 비활성 기체로, 거의 반응하지 않습니다. 전구 내부나 금속 용접에서 산화를 막는 보호 기체로 쓰입니다.",
  19:"칼륨은 나트륨과 비슷하게 반응성이 큰 알칼리 금속입니다. 우리 몸에서는 신경 신호 전달과 근육 수축을 돕는 중요한 이온으로 작동합니다.",
  20:"칼슘은 뼈와 치아를 단단하게 만드는 대표 원소입니다. 근육 수축과 신경 전달처럼 몸의 기본 기능에도 꼭 필요합니다.",
  21:"스칸듐은 가볍고 알루미늄과 합금으로 만들면 강도가 좋아져 항공·스포츠 장비에 쓰입니다. 널리 쓰이는 금속은 아니지만 소량으로도 재료 성능을 바꾸는 조연 같은 원소입니다.",
  22:"타이타늄은 가볍고 강하면서 잘 녹슬지 않아 비행기, 인공관절, 안경테 같은 제품에 쓰입니다. 몸과의 반응이 비교적 적어 의료 재료로도 중요합니다.",
  23:"바나듐은 강철에 조금만 넣어도 단단함과 내구성을 높여 주는 금속입니다. 공구나 자동차 부품 같은 튼튼함이 필요한 재료에서 활약합니다.",
  24:"크로뮴은 금속 표면을 반짝이고 녹슬기 어렵게 만드는 도금 재료로 유명합니다. 스테인리스강의 내식성을 높이는 핵심 성분이기도 합니다.",
  25:"망가니즈는 철강을 만들 때 불순물을 줄이고 강도를 높이는 데 도움을 줍니다. 건전지 소재로도 쓰여 일상 전자기기와 연결되는 원소입니다.",
  26:"철은 건물, 자동차, 기계를 이루는 대표 금속으로 현대 문명의 뼈대 같은 재료입니다. 우리 몸에서는 헤모글로빈 성분으로 산소 운반에 꼭 필요합니다.",
  27:"코발트는 배터리와 강한 자석 재료에 자주 쓰여 전기차·전자기기 산업에서 중요합니다. 파란색 유리·도자기 안료로도 오래전부터 사용되었습니다.",
  28:"니켈은 녹에 강해 스테인리스강과 도금 재료에 널리 쓰입니다. 충전식 배터리의 전극 재료로도 활용되어 에너지 저장 기술과 관련이 깊습니다.",
  29:"구리는 전기와 열을 잘 전달해 전선, 모터, 회로 부품에 빠지지 않는 금속입니다. 비교적 가공이 쉬워 배관과 합금 재료로도 오래 쓰였습니다.",
  30:"아연은 철 표면을 보호하는 도금에 많이 쓰여 녹을 막아 줍니다. 우리 몸에서는 여러 효소 작용에 필요한 필수 미량 원소입니다.",
  31:"갈륨은 손의 온도 근처에서도 녹을 수 있는 독특한 금속입니다. 반도체 재료로 쓰여 LED와 고주파 전자소자 분야에서 중요합니다.",
  32:"저마늄은 규소와 비슷한 반도체 성질을 보여 초기 트랜지스터 개발에 큰 역할을 했습니다. 지금도 광통신과 적외선 센서 재료로 쓰입니다.",
  33:"비소는 독성으로 잘 알려져 있어 취급에 매우 주의해야 합니다. 한편 반도체 화합물(예: 갈륨비소)에서는 전자소자 성능을 높이는 재료로 사용됩니다.",
  34:"셀레늄은 빛을 받으면 전기적 성질이 달라지는 특징이 있어 광센서 기술에 활용되었습니다. 사람에게는 아주 적은 양이 필요한 미량 원소이지만 과다 섭취는 해롭습니다.",
  35:"브로민은 상온에서 액체인 드문 비금속 할로젠입니다. 난연제나 의약·화학 중간체 등 다양한 화합물 형태로 산업에서 쓰입니다.",
  36:"크립톤은 반응이 거의 없는 비활성 기체로 공기 중에 아주 소량 들어 있습니다. 특수 조명과 일부 레이저 같은 장치에서 사용됩니다.",
  47:"아름다운 광택과 높은 전도성을 가진 금속입니다. 장신구와 전기 부품에 모두 쓰입니다.",
  53:"갑상샘 호르몬과 관련이 깊은 할로젠 원소입니다. 보라색 증기를 떠올리게 하는 원소로도 알려져 있습니다.",
  56:"알칼리 토금속에 속하는 무거운 원소입니다. 바륨 화합물은 의료 영상과 불꽃 색에서 자주 언급됩니다.",
  74:"녹는점이 매우 높은 금속입니다. 전구 필라멘트와 고온 재료를 떠올리게 합니다.",
  78:"귀금속에 속하는 안정적인 금속입니다. 촉매와 장신구, 정밀 산업에서 중요한 역할을 합니다.",
  79:"잘 변하지 않고 아름다운 광택을 가진 귀금속입니다. 오래전부터 가치와 권력의 상징으로 여겨졌습니다.",
  80:"상온에서 액체인 독특한 금속입니다. 독성이 있으므로 취급에 주의해야 하는 원소입니다.",
  82:"무겁고 부드러운 금속입니다. 과거에는 널리 쓰였지만 독성 문제 때문에 사용이 크게 제한되었습니다.",

let activeFilter="all", activeSearch="", activeLayer="none", raf=null;
let compareMode=false, compareSelection=[];
let relationMode=false, selectedElementN=null;
let masterMode=false, masterViewMode="all";

const EXAMPLES={
  "Cl-Na":"Na + Cl → NaCl",
  "H-O":"H + O → H₂O",
  "C-O":"C + O → CO₂",
  "Mg-O":"Mg + O → MgO"
};

function gc(cat){return CC[cat]||CC["unknown"]}

function shells(n){
  const caps=[2,8,18,32,32,18,8];
  const out=[];let r=n;
  for(let i=0;i<caps.length&&r>0;i++){const p=Math.min(r,caps[i]);out.push(p);r-=p;}
  return out;
}

function buildLegend(){
  const ld=document.getElementById("legend");
  Object.entries(CKR).forEach(([k,v])=>{
    const c=gc(k);
    const d=document.createElement("div");
    d.className="leg";
    d.innerHTML=`<div class="leg-dot" style="background:${c.bg};border:0.5px solid ${c.bd}"></div><span>${v}</span>`;
    ld.appendChild(d);
  });
}

function makeCell(el){
  const div=document.createElement("div");
  div.className="cell";
  div.dataset.n=el.n;
  const c=gc(el.cat);
  div.style.color=c.text;
  div.innerHTML=`<span class="num">${el.n}</span><span class="sym">${el.sym}</span><span class="elname">${el.name}</span>`;
  div.addEventListener("click",function(){
    const found=EL.find(e=>e.n===parseInt(this.dataset.n));
    if(!found)return;
    if(compareMode){
      handleCompareSelect(found);
      return;
    }
    openPanel(found);
  });
  return div;
}
function getBondHint(a,b){
  if(a.cat==="noble gas"||b.cat==="noble gas")return "비활성 기체는 일반적으로 반응성이 낮습니다.";
  const am=/metal/.test(a.cat)||a.cat==="lanthanide"||a.cat==="actinide";
  const bm=/metal/.test(b.cat)||b.cat==="lanthanide"||b.cat==="actinide";
  const an=a.cat==="nonmetal";
  const bn=b.cat==="nonmetal";
  if(am&&bm)return "둘 다 금속이므로 금속 결합의 관점에서 볼 수 있습니다.";
  if((am&&bn)||(bm&&an))return "이온 결합이 만들어지기 쉬운 조합입니다.";
  if((an&&bn)||a.cat==="metalloid"||b.cat==="metalloid")return "공유 결합을 생각해 볼 수 있는 조합입니다.";
  return "결합 유형은 조건에 따라 달라질 수 있습니다.";
}
function getExample(a,b){
  const key=[a.sym,b.sym].sort().join("-");
  return EXAMPLES[key]||"대표 예시는 아직 준비되지 않았습니다.";
}
function renderCompareCard(){
  const card=document.getElementById("compare-card");
  if(!compareMode||compareSelection.length<2){card.classList.remove("show");card.innerHTML="";return;}
  const [a,b]=compareSelection;
  const ea=parseFloat(a.en), eb=parseFloat(b.en);
  const enDiff=(!Number.isNaN(ea)&&!Number.isNaN(eb))?Math.abs(ea-eb).toFixed(2):"비교 불가";
  card.innerHTML=`<div class="cmp-title">두 원소 비교 결과</div>
  <div class="cmp-grid">
    <div class="cmp-col">
      <div class="cmp-head">${a.name} (${a.sym})</div>
      <div class="cmp-line">원자번호: ${a.n}</div>
      <div class="cmp-line">분류: ${CKR[a.cat]||a.cat}</div>
      <div class="cmp-line">최외각 전자: ${valenceElectrons(a)}개</div>
    </div>
    <div class="cmp-col">
      <div class="cmp-head">${b.name} (${b.sym})</div>
      <div class="cmp-line">원자번호: ${b.n}</div>
      <div class="cmp-line">분류: ${CKR[b.cat]||b.cat}</div>
      <div class="cmp-line">최외각 전자: ${valenceElectrons(b)}개</div>
    </div>
  </div>
  <div class="cmp-note">전기음성도 차이: ${enDiff}</div>
  <div class="cmp-note">결합 성향 힌트: ${getBondHint(a,b)}</div>
  <div class="cmp-note">대표 예시: ${getExample(a,b)}</div>`;
  card.classList.add("show");
}
function handleCompareSelect(el){
  openPanel(el);
  if(compareSelection.length===2)compareSelection=[];
  if(compareSelection.length===1&&compareSelection[0].n===el.n)return;
  compareSelection.push(el);
  renderCompareCard();
}

function clamp01(v){return Math.max(0,Math.min(1,v));}
function mix(v,min,max){if(max===min)return 0;return clamp01((v-min)/(max-min));}
function valenceElectrons(el){
  if(el.group>=1&&el.group<=2)return el.group;
  if(el.group>=13&&el.group<=18)return el.group-10;
  const sh=shells(el.n);
  return sh[sh.length-1];
}
function trendScore(el){
  const p=el.period<=7?el.period:(el.period===9?6:7);
  const g=el.group;
  if(activeLayer==="none")return null;
  if(activeLayer==="en"){
    const en=parseFloat(el.en);
    if(!Number.isNaN(en))return mix(en,0.7,4.0);
    return mix((g/18)+(1-p/7),0.2,1.9);
  }
  if(activeLayer==="radius")return mix((p/7)+(1-g/18),0.2,1.9);
  if(activeLayer==="ionization")return mix((g/18)+(1-p/7),0.2,1.9);
  if(activeLayer==="metallicity")return mix((p/7)+(1-g/18),0.2,1.9);
  if(activeLayer==="valence")return mix(valenceElectrons(el),1,8);
  return null;
}
function layerColor(){
  if(activeLayer==="radius"||activeLayer==="metallicity")return [255,168,76];
  if(activeLayer==="en"||activeLayer==="ionization")return [73,146,245];
  if(activeLayer==="valence")return [138,110,232];
  return [255,255,255];
}
function applyLayerColors(){
  const rgb=layerColor();
  document.querySelectorAll(".cell:not(.blank)").forEach(c=>{
    const el=EL.find(e=>e.n===parseInt(c.dataset.n));
    if(!el)return;
    const cc=gc(el.cat);
    const score=trendScore(el);
    if(score===null){
      c.style.background=cc.bg;
      c.style.color=cc.text;
      return;
    }
    const alpha=(0.05+score*0.28).toFixed(3);
    c.style.background=`linear-gradient(rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha}),rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})),${cc.bg}`;
    c.style.color=cc.text;
  });
}
function updateLayerNote(){
  const notes={
    none:"기본: 기존 원소 분류 색상을 표시합니다.",
    en:"전기음성도: 오른쪽 위로 갈수록 대체로 커집니다.",
    radius:"원자 반지름: 왼쪽 아래로 갈수록 대체로 커집니다.",
    ionization:"이온화 에너지: 오른쪽 위로 갈수록 대체로 커집니다.",
    metallicity:"금속성: 왼쪽 아래로 갈수록 대체로 강해집니다.",
    valence:"최외각 전자: 같은 족 원소들은 비슷한 최외각 전자 수를 가집니다."
  };
  document.getElementById("layer-note").textContent=notes[activeLayer]||notes.none;
}

function buildGrid(){
  const grid=document.getElementById("grid");
  const map={};
  EL.forEach(e=>{if(e.period<=7)map[`${e.period}-${e.group}`]=e;});
  for(let r=1;r<=7;r++){
    for(let g=1;g<=18;g++){
      const el=map[`${r}-${g}`];
      if(el){grid.appendChild(makeCell(el));}
      else{const b=document.createElement("div");b.className="cell blank";grid.appendChild(b);}
    }
  }
  const sa=document.getElementById("series-area");
  ["lanthanide","actinide"].forEach((cat,i)=>{
    const row=document.createElement("div");
    row.className="srow";
    const lbl=document.createElement("div");
    lbl.className="slbl";
    lbl.textContent=i===0?"57–71":"89–103";
    row.appendChild(lbl);
    EL.filter(e=>e.cat===cat).forEach(e=>row.appendChild(makeCell(e)));
    sa.appendChild(row);
  });
}

function applyFilter(){
  document.querySelectorAll(".cell:not(.blank)").forEach(c=>{
    const el=EL.find(e=>e.n===parseInt(c.dataset.n));
    if(!el)return;
    const cm=activeFilter==="all"||el.cat===activeFilter;
    const q=activeSearch.toLowerCase();
    const sm=!q||(el.name.toLowerCase().includes(q)||el.sym.toLowerCase().includes(q)||String(el.n).includes(q));
    c.classList.toggle("dimmed",!(cm&&sm));
  });
  applyMasterModeStyles();
}
function applyMasterModeStyles(){
  document.querySelectorAll(".cell:not(.blank)").forEach(c=>{
    const el=EL.find(e=>e.n===parseInt(c.dataset.n));
    if(!el)return;
    c.classList.remove("hide-name","hide-sym");
    if(masterMode){
      if(el.n>20)c.classList.add("dimmed");
      if(el.n<=20&&masterViewMode==="hide-name")c.classList.add("hide-name");
      if(el.n<=20&&masterViewMode==="hide-sym")c.classList.add("hide-sym");
    }
  });
}
function clearRelationshipHighlight(){
  document.querySelectorAll(".cell.rel-group,.cell.rel-period,.cell.rel-focus").forEach(c=>{
    c.classList.remove("rel-group","rel-period","rel-focus");
  });
}
function applyRelationshipHighlight(el){
  clearRelationshipHighlight();
  if(!relationMode||!el)return;
  document.querySelectorAll(".cell:not(.blank)").forEach(c=>{
    const item=EL.find(e=>e.n===parseInt(c.dataset.n));
    if(!item)return;
    const sameGroup=typeof el.group==="number"&&typeof item.group==="number"&&item.group===el.group;
    const samePeriod=typeof el.period==="number"&&typeof item.period==="number"&&item.period===el.period;
    if(sameGroup)c.classList.add("rel-group");
    if(samePeriod)c.classList.add("rel-period");
    if(item.n===el.n)c.classList.add("rel-focus");
  });
}
function relationDescription(el){
  const isSpecialRow=el.cat==="lanthanide"||el.cat==="actinide"||el.period>7;
  const groupText=(typeof el.group==="number"&&!isSpecialRow)
    ? `${el.name}은 ${el.group}족 원소입니다. 같은 족 원소들은 최외각 전자 수가 비슷해 성질도 비슷하게 나타납니다.`
    : `${el.name}은 특수 계열 원소로 분류되며, 일반적인 족 비교보다는 계열 내부 경향을 함께 보는 것이 자연스럽습니다.`;
  const pd=el.period<=7?el.period:(el.period===9?6:7);
  const periodText=`${el.name}은 ${pd}주기 원소입니다. 같은 주기에서는 왼쪽에서 오른쪽으로 갈수록 성질이 점진적으로 변합니다.`;
  return `<strong style="font-size:11px;font-weight:500">같은 족·주기 관계</strong><br>${groupText}<br>${periodText}`;
}

function openPanel(el){
  if(raf){cancelAnimationFrame(raf);raf=null;}
  document.querySelectorAll(".cell.sel").forEach(c=>{c.classList.remove("sel");c.style.borderColor="";});
  const cell=document.querySelector(`.cell[data-n="${el.n}"]`);
  const c=gc(el.cat);
  if(cell){cell.style.borderColor=c.bd;cell.classList.add("sel");}
  const badge=document.getElementById("pbadge");
  badge.style.cssText=`background:${c.bg};color:${c.text};width:62px;height:62px;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0`;
  document.getElementById("psym").textContent=el.sym;
  document.getElementById("pnum").textContent=el.n;
  document.getElementById("pname").textContent=el.name;
  document.getElementById("pcat").textContent=CKR[el.cat]||el.cat;
  document.getElementById("pec").textContent="전자 배치: "+el.ec;
  document.getElementById("s-mass").textContent=el.mass;
  document.getElementById("s-phase").textContent=PKR[el.phase]||el.phase;
  document.getElementById("s-en").textContent=el.en;
  const pd=el.period<=7?el.period:(el.period===9?6:7);
  document.getElementById("s-period").textContent=pd+"주기";
  document.getElementById("s-group").textContent=el.group+"족";
  document.getElementById("s-ecount").textContent=el.n+"개";
  const rNote=document.getElementById("relation-note");
  rNote.innerHTML=relationMode?relationDescription(el):"";
  document.getElementById("story-text").textContent=ELEMENT_STORIES[el.n]||"이 원소의 이야기는 준비 중입니다.";
  selectedElementN=el.n;
  applyRelationshipHighlight(el);
  const sh=shells(el.n);
  document.getElementById("shell-note").textContent=`전자껍질: ${sh.join(", ")} / 최외각 전자: ${sh[sh.length-1]}개`;
  const panel=document.getElementById("panel");
  panel.classList.add("show");
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
  startAnim(el);
}

function closePanel(){
  if(raf){cancelAnimationFrame(raf);raf=null;}
  document.getElementById("panel").classList.remove("show");
  document.getElementById("compare-card").classList.remove("show");
  document.querySelectorAll(".cell.sel").forEach(c=>{c.classList.remove("sel");c.style.borderColor="";});
  selectedElementN=null;
  clearRelationshipHighlight();
  document.getElementById("relation-note").innerHTML="";
}

function startAnim(el){
  const sh=shells(el.n);
  const sNames=["K","L","M","N","O","P","Q"];
  const canvas=document.getElementById("ecanvas");
  const ctx=canvas.getContext("2d");
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const cssW=Math.min(canvas.parentElement.clientWidth,420);
  const cssH=cssW*0.75;
  canvas.width=Math.round(cssW*dpr);
  canvas.height=Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=cssW,H=cssH,cx=W/2,cy=H/2;
  const ns=sh.length;
  const minR=Math.max(18,Math.min(W,H)*0.08),maxR=Math.min(cx,cy)-20;
  const radii=sh.map((_,i)=>ns===1?minR+14:minR+(maxR-minR)*(i/(ns-1)));
  const angles=sh.map((cnt,_)=>Array.from({length:cnt},(_,j)=>j*(2*Math.PI/cnt)));
  const speeds=radii.map((_,i)=>(0.0008/(i*0.45+1))*((i%2===0)?1:-1));
  const c=gc(el.cat);

  function frame(t){
    ctx.clearRect(0,0,W,H);
    radii.forEach(r=>{
      ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);
      ctx.strokeStyle="rgba(128,128,128,0.15)";ctx.lineWidth=1;ctx.stroke();
    });
    ctx.beginPath();ctx.arc(cx,cy,18,0,2*Math.PI);
    ctx.fillStyle=c.bg;ctx.fill();
    ctx.strokeStyle=c.bd;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=c.text;
    ctx.font=`600 ${el.n>99?8:el.n>9?10:12}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(el.sym,cx,cy-5);
    ctx.font=`500 9px ${getComputedStyle(document.body).fontFamily}`;
    ctx.fillText(`Z=${el.n}`,cx,cy+7);
    sh.forEach((cnt,si)=>{
      const r=radii[si];
      ctx.fillStyle="rgba(120,120,120,0.72)";
      ctx.font=`10px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign="left";ctx.textBaseline="middle";
      ctx.fillText(sNames[si]||`n${si+1}`,cx+r+8,cy-8);
      for(let ei=0;ei<cnt;ei++){
        const a=angles[si][ei]+t*speeds[si];
        const ex=cx+r*Math.cos(a),ey=cy+r*Math.sin(a);
        ctx.beginPath();ctx.arc(ex,ey,4.5,0,2*Math.PI);
        const isValence=si===ns-1;
        ctx.fillStyle=isValence?"#FFD76A":c.bd;
        ctx.shadowColor=isValence?"rgba(255,215,106,0.7)":"transparent";
        ctx.shadowBlur=isValence?8:0;
        ctx.fill();
        ctx.shadowBlur=0;
      }
      ctx.fillStyle="rgba(120,120,120,0.7)";
      ctx.font=`9px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign="left";ctx.textBaseline="middle";
      const lx=cx+radii[si]+7;
      const ly=cy+(ns>1?(si-(ns-1)/2)*14:0);
      if(lx<W-4)ctx.fillText(cnt+"e⁻",lx,ly);
    });
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}

document.querySelectorAll(".fb[data-cat]").forEach(btn=>{
  btn.addEventListener("click",function(){
    document.querySelectorAll(".fb").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    activeFilter=this.dataset.cat;
    applyFilter();
  });
});
document.getElementById("search").addEventListener("input",function(){
  activeSearch=this.value.trim();
  applyFilter();
});

function updateModeNote(){
  const note=document.getElementById("mode-note");
  if(compareMode){
    note.textContent="두 원소를 차례로 선택하면 최외각 전자, 전기음성도, 결합 성향을 비교합니다.";
    return;
  }
  if(relationMode){
    note.textContent="선택한 원소와 같은 족, 같은 주기의 원소를 은은하게 강조합니다.";
    return;
  }
  if(masterMode){
    note.textContent="1~20번 원소를 집중해서 익히는 모드입니다.";
    return;
  }
  note.textContent="";
}
function updateMasterControls(){
  const wrap=document.getElementById("master-study-controls");
  wrap.classList.toggle("show",masterMode);
  wrap.querySelectorAll(".lb[data-master-view]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.masterView===masterViewMode);
  });
}

buildLegend();
buildGrid();
applyLayerColors();
updateLayerNote();
updateModeNote();
updateMasterControls();

document.querySelectorAll(".lb").forEach(btn=>{
  btn.addEventListener("click",function(){
    document.querySelectorAll(".lb").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    activeLayer=this.dataset.layer;
    applyLayerColors();
    updateLayerNote();
  });
});
document.getElementById("compare-toggle").addEventListener("click",function(){
  compareMode=!compareMode;
  this.classList.toggle("active",compareMode);
  if(!compareMode){compareSelection=[];renderCompareCard();}
  updateModeNote();
});
document.getElementById("relation-toggle").addEventListener("click",function(){
  relationMode=!relationMode;
  this.classList.toggle("active",relationMode);
  const activeEl=selectedElementN?EL.find(e=>e.n===selectedElementN):null;
  if(relationMode&&activeEl){
    applyRelationshipHighlight(activeEl);
    document.getElementById("relation-note").innerHTML=relationDescription(activeEl);
  }else{
    clearRelationshipHighlight();
    document.getElementById("relation-note").innerHTML="";
  }
  updateModeNote();
});
document.getElementById("master-toggle").addEventListener("click",function(){
  masterMode=!masterMode;
  this.classList.toggle("active",masterMode);
  if(!masterMode)masterViewMode="all";
  applyFilter();
  updateModeNote();
  updateMasterControls();
});
document.querySelectorAll(".lb[data-master-view]").forEach(btn=>{
  btn.addEventListener("click",function(){
    masterViewMode=this.dataset.masterView;
    applyMasterModeStyles();
    updateMasterControls();
  });
});
</script>
